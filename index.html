<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thusa Small Biz - North West</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#000;color:#fff;padding:18px;text-align:center;position:sticky;top:0}h1{margin:0}button.add{background:#FFD700;color:#000;border:none;padding:14px 22px;border-radius:25px;font-weight:bold;font-size:16px;margin-top:10px}.grid{padding:12px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)} .price{font-weight:bold;font-size:18px} .meta{color:#666;font-size:13px;margin:5px 0} .btn{ background:#25D366;color:#fff;padding:10px 14px;border-radius:8px;display:inline-block;text-decoration:none;font-weight:bold;margin-top:8px} .top{ background:#fff;padding:12px;display:flex;gap:8px} input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} #formBox{display:none;background:#fff;padding:15px;margin:12px;border-radius:14px} .small{font-size:12px;color:#777}</style></head><body>
<header><h1>Thusa Small Biz</h1><p style="margin:5px">North West Youth Marketplace - Help Everyone Sell!</p><button class="add" onclick="document.getElementById('formBox').style.display='block';window.scrollTo(0,0)">+ Add My Business</button><p class="small">078 552 1424 | Lorato - Mogopela</p></header>

<div id="formBox"><h3>Add Your Product</h3><input id="biz" placeholder="Your Name / Business Name e.g. Mama K's Bakery"><input id="prod" placeholder="What do you sell? e.g. Tray Cake"><input id="price" type="number" placeholder="Price in Pula e.g. 80"><input id="wa" placeholder="Your WhatsApp number e.g. 26771234567"><input id="loc" placeholder="Location e.g. Mogopela, Letlhakane"><textarea id="desc" placeholder="Describe - e.g. Fresh daily, with pearls"></textarea><button onclick="addProd()" style="background:#000;color:#fff;padding:12px;width:100%;border-radius:8px;font-weight:bold">Publish My Product</button><button onclick="this.parentElement.style.display='none'" style="background:#eee;padding:10px;width:100%;margin-top:6px;border-radius:8px">Close</button></div>

<div class="top"><select id="filter" onchange="render()"><option value="all">All Villages</option><option>Mogopela</option><option>Letlhakane</option><option>Orapa</option><option>Other NW</option></select><input id="search" placeholder="Search cake, braids..." oninput="render()"></div>

<div id="grid" class="grid"></div>
<footer style="text-align:center;padding:15px;color:#777">Built by Lorato for FNB App of Year 2026 - Helping Small Businesses</footer>
<script>
let prods = JSON.parse(localStorage.getItem('thusa_v2')||'[]');
if(prods.length==0){ prods=[{biz:"Thusa Demo",prod:"Tray Cake",price:80,wa:"27785521424",loc:"Mogopela",desc:"Fresh bakery - example"}, {biz:"Green Youth",prod:"Organic Veggies",price:20,wa:"27785521424",loc:"Mogopela",desc:"Beetroot, Carrots, Spinach"}, {biz:"Beauty by Neo",prod:"Bridal Braids",price:250,wa:"27785521424",loc:"Letlhakane",desc:"With pearls"}]; }
function addProd(){let b=biz.value,p=prod.value,pr=price.value,w=wa.value,l=loc.value,d=desc.value; if(!b||!p||!pr||!w){alert('Please fill Name, Product, Price, WhatsApp');return;} prods.unshift({biz:b,prod:p,price:pr,wa:w.replace(/[^0-9]/g,''),loc:l||'North West',desc:d}); localStorage.setItem('thusa_v2',JSON.stringify(prods)); biz.value=prod.value=price.value=wa.value=loc.value=desc.value=''; document.getElementById('formBox').style.display='none'; render(); alert('Published! Everyone can see it now!');}
function render(){let f=filter.value,s=search.value.toLowerCase(); let list=prods.filter(x=>(f=='all'||x.loc.includes(f))&&(x.prod.toLowerCase().includes(s)||x.biz.toLowerCase().includes(s))); grid.innerHTML=list.map((x,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${x.prod} - P${x.price}</b><span style="cursor:pointer" onclick="if(confirm('Delete?')){prods.splice(${prods.indexOf(x)},1);localStorage.setItem('thusa_v2',JSON.stringify(prods));render()}">❌</span></div><div class="meta">🏪 ${x.biz} | 📍 ${x.loc}</div><div style="font-size:14px">${x.desc||''}</div><a class="btn" href="https://wa.me/${x.wa}?text=Hello%20${encodeURIComponent(x.biz)}%2C%20I%20want%20${encodeURIComponent(x.prod)}%20P${x.price}%20from%20Thusa%20App" target="_blank">Order on WhatsApp</a></div>`).join('')||'<p style="text-align:center">No products yet. Be first to Add!</p>';}
render();
</script></body></html>
